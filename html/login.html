<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PGRC</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.js"></script>     <!-- Questo script è SHA-256 -->
    <script src="../js/utility.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/authentication.js"></script>
    <link href="../css/login.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <!-- Logo -->
    <a class="box-logo" href="home.html">
        <img class="logo-img" src="../img/logo.png" alt="PGRC Logo">
        <h1 class="logo-text">PGRC</h1>
    </a>

    
    <div id="wrapper" class="container-fluid p-0 d-flex vh-100 vw-100">
        
        <!-- Parte sinistra (Login) -->
        <div class="left-section col-md-8 text-center align-content-center">
            <div>
                <h1 class="bold-48">Login to Your Account</h1>
                <form>
                    <div>
                        <input id="email" type="email" name="email" placeholder="Email">
                    </div>
                    <div class="mb-5 mt-4">
                        <div class="password-container">
                            <input id="password" type="password" name="psw" placeholder="Password">
                            <span id="togglePassword" class="material-symbols-outlined">visibility</span>
                        </div>
                        <div id="mexFailed" class="text-correct">Your credentials are wrong!</div>
                    </div>
                    <button type="submit" class="bottone-primario" onclick="event.preventDefault(); loginValidation()">Login</button>
                </form>
            </div>
        </div>

        <!-- Parte destra (Signup) -->
        <div class="right-section col-md-4 pe-5 ps-5 text-white align-content-center text-center">
            <h1 class="extrabold-72">New Here?</h1>
            <p class="light-36">Sign up and discover a great amount of new opportunities!</p>
            <button class="bottone-secondario" onclick="transitionToPage('./signup.html')">Sign Up</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
